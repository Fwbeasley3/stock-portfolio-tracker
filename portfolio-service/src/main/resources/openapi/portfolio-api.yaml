openapi: 3.0.3

info:
  title: Portfolio Tracker API
  description: REST API for Managing Investment Portfolios
  version: 1.0.0

servers:
  - url: /api/v1

paths:
  /portfolios:
    post:
      tags:
        - Portfolios
      summary: Create a portfolio
      operationId: createPortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePortfolioRequest'
      responses:
        '201':
          description: Portfolio created successfully
          headers:
            Location:
              description: URI of the newly created portfolio
              required: true
              schema:
                type: string
                format: uri-reference
              example: /api/v1/portfolios/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioResponse'
        '400':
          description: Invalid request
    get:
      tags:
        - Portfolios
      summary: Retrieve all portfolios for the authenticated user
      operationId: getPortfolios
      responses:
        '200':
          description: Portfolios retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortfolioResponse'
  /portfolios/{portfolioId}:
    get:
      tags:
        - Portfolios
      summary: Retrieve a portfolio by ID
      operationId: getPortfolio
      parameters:
        - name: portfolioId
          in: path
          required: true
          description: Unique identifier of the portfolio
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Portfolio retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioResponse'
        '404':
          description: Portfolio not found
    patch:
      tags:
        - Portfolios
      summary: Update an existing portfolio
      operationId: updatePortfolio
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePortfolioRequest'
      responses:
        '200':
          description: Portfolio renamed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioResponse'
        '400':
          description: Invalid request
        '404':
          description: Portfolio not found
    delete:
      tags:
        - Portfolios
      summary: Delete an existing portfolio
      operationId: deletePortfolio
      parameters:
        - name: portfolioId
          in: path
          required: true
          description: Unique identifier of the portfolio to delete
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Portfolio deleted successfully
        '404':
          description: Portfolio not found
  /portfolios/{portfolioId}/holdings:
    get:
      tags:
        - Holdings
      summary: Retrieve all holdings for the authenticated user and portfolio ID
      parameters:
        - name: portfolioId
          in: path
          required: true
          description: ID of the portfolio receiving the holding
          schema:
            type: integer
            format: int64
      operationId: getHoldings
      responses:
        '200':
          description: Holdings retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HoldingResponse'
        '404':
          description: Portfolio not found
  /portfolios/{portfolioId}/holdings/{holdingId}:
    get:
      tags:
        - Holdings
      summary: Retrieve a holding by ID
      operationId: getHolding
      parameters:
        - name: portfolioId
          in: path
          required: true
          description: Unique identifier of the portfolio
          schema:
            type: integer
            format: int64
        - name: holdingId
          in: path
          required: true
          description: Unique identifier of a holding
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Holding retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingResponse'
        '404':
          description: Holding or Portfolio not found
  /portfolios/{portfolioId}/transactions:
    post:
      tags:
        - Transactions
      summary: Create a Transaction
      operationId: createTransaction
      parameters:
        - name: portfolioId
          in: path
          required: true
          description: ID of the portfolio the transaction belongs to
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '201':
          description: Transaction created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: Invalid transaction request
        '404':
          description: Portfolio not found
        '409':
          description: Transaction SELL may not exceed available shares
    get:
      tags:
        - Transactions
      summary: Get portfolio transaction history
      operationId: getTransactions
      parameters:
        - name: portfolioId
          in: path
          required: true
          description: ID of the portfolio
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Transaction history retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: Invalid request

        '404':
          description: Portfolio not found
  /portfolios/{portfolioId}/valuation:
    get:
      tags:
        - Portfolios
      summary: Retrieve the current valuation of a portfolio by ID
      operationId: getPortfolioValuation
      parameters:
        - name: portfolioId
          in: path
          required: true
          description: Unique identifier of the portfolio
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Portfolio valuation calculated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioValuationResponse'
        '404':
          description: Portfolio not found
        '503':
          description: Market Data Service Unavailable
components:
  schemas:
    CreatePortfolioRequest:
      type: object
      required:
        - name
      properties:
        name:
          $ref: '#/components/schemas/Name'
    UpdatePortfolioRequest:
      type: object
      required:
        - name
      properties:
        name:
          $ref: '#/components/schemas/Name'
    PortfolioResponse:
      type: object
      required:
        - id
        - name
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          $ref: '#/components/schemas/Name'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-22T15:30:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-23T13:00:00Z'
    Name:
      type: string
      minLength: 1
      maxLength: 255
    Symbol:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^[A-Za-z][A-Za-z0-9.-]*$'
      example: AAPL
    HoldingQuantity:
      type: number
      minimum: 0
      example: 10
    TransactionQuantity:
      type: number
      minimum: 0
      exclusiveMinimum: true
      example: 10
    AverageCost:
      type: number
      minimum: 0
      example: 185.50
    Type:
      type: string
      enum:
        - BUY
        - SELL
    PricePerShare:
      type: number
      minimum: 0
      exclusiveMinimum: true
      example: 185.50
    HoldingResponse:
      type: object
      required:
        - id
        - symbol
        - quantity
        - averageCost
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        symbol:
          $ref: '#/components/schemas/Symbol'
        quantity:
          $ref: '#/components/schemas/HoldingQuantity'
        averageCost:
          $ref: '#/components/schemas/AverageCost'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateTransactionRequest:
      type: object
      required:
        - symbol
        - type
        - quantity
        - pricePerShare
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        type:
          $ref: '#/components/schemas/Type'
        quantity:
          $ref: '#/components/schemas/TransactionQuantity'
        pricePerShare:
          $ref: '#/components/schemas/PricePerShare'
    TransactionResponse:
      type: object
      required:
        - id
        - symbol
        - type
        - quantity
        - pricePerShare
        - executedAt
      properties:
        id:
          type: integer
          format: int64
        symbol:
          $ref: '#/components/schemas/Symbol'
        type:
          $ref: '#/components/schemas/Type'
        quantity:
          $ref: '#/components/schemas/TransactionQuantity'
        pricePerShare:
          $ref: '#/components/schemas/PricePerShare'
        executedAt:
          type: string
          format: date-time
    HoldingValuationResponse:
      type: object
      required:
        - symbol
        - quantity
        - currentPrice
        - marketValue
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        quantity:
          $ref: '#/components/schemas/HoldingQuantity'
        currentPrice:
          type: number
          description: Current market price per share
        marketValue:
          type: number
          description: Quantity multiplied by current market price
    PortfolioValuationResponse:
      type: object
      required:
        - portfolioId
        - totalMarketValue
        - holdings
      properties:
        portfolioId:
          type: integer
          format: int64
        totalMarketValue:
          type: number
          description: Sum of all holding market values
        holdings:
          type: array
          items:
            $ref: '#/components/schemas/HoldingValuationResponse'
